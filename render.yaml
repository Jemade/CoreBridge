# ═══════════════════════════════════════════════════════════════════
# COREBRIDGE PLATFORM: RENDER STATIC SITE SPECIFICATION
# Smarter Systems. Stronger Businesses.
# ═══════════════════════════════════════════════════════════════════

services:
  # ─────────────────────────────────────────────────────────────────
  # React / Vite Static Site (Global Edge CDN)
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: corebridge-frontend
    runtime: static
    plan: free
    region: frankfurt
    rootDir: .
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
